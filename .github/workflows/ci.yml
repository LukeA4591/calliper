name: Verify starter
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Integration tests need the local inbox. Normalise here so a developer's
      # committed SMTP block cannot break CI.
      - run: pnpm email:configure local
      - run: pnpm db:start > /tmp/supabase-start.log 2>&1
      - run: pnpm db:reset
      - run: pnpm test:integration
